
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Portrait des communes du Parc</title>
    <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
    
    <!-- MapLibre -->
    <link href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
#legende {
    position: absolute;
    bottom: 30px;
    right: 10px;
    background: white;
    padding: 12px;
    border-radius: 5px;
    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    z-index: 10;
    font-family: Arial, sans-serif;
    font-size: 12px;
    max-width: 280px;
}

#legende h3 {
    margin: 0 0 12px 0;
    font-size: 15px;
}

#legende h4 {
    margin: 10px 0;
    font-size: 13px;
}
.element-legende {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    cursor: pointer;
}

.element-legende:hover {
    background: #eeeeee;
}

.element-legende.inactive {
    opacity: 0.35;
    text-decoration: line-through;
}

.couleur {
    width: 15px;
    height: 15px;
    margin-right: 8px;
    border: 1px solid #555;
    flex-shrink: 0;
}

.ligne {
    width: 15px;
    height: 3px;
    margin-right: 8px;
    background: #e68a24;
    flex-shrink: 0;
}

.point {
    width: 12px;
    height: 12px;
    margin: 0 9px 0 2px;
    border-radius: 50%;
    background: #2864a5;
    flex-shrink: 0;
}

.cercle {
    display: inline-block;
    border-radius: 50%;
    background: #2864a5;
    margin-right: 8px;
    flex-shrink: 0;
}

.cercle-petit {
    width: 6px;
    height: 6px;
}

.cercle-moyen {
    width: 10px;
    height: 10px;
}

.cercle-grand {
    width: 15px;
    height: 15px;
}

.cercle-tres-grand {
    width: 21px;
    height: 21px;
}
    </style>
</head>

<body>

    <div id="map"></div>
<div id="legende">
    <h3>Légende – Couches affichées</h3>

   <div class="element-legende" data-layer="communes">
    <span class="couleur" style="background: #9acb9a;"></span>
    <span class="couleur" style="background: #e76f51;"></span>
    Communes (hors cœur / intersectant le cœur)
</div>

    <div class="element-legende" data-layer="coeur">
        <span class="couleur" style="background: #41ab5d;"></span>
        Cœur du Parc
    </div>

    <div class="element-legende" data-layer="aire">
        <span class="ligne"></span>
        Aire d'adhésion
    </div>

    <div class="element-legende" data-layer="communes_points">
        <span class="point"></span>
        Population
    </div>

    <hr>
    <h4>Population des communes</h4>

    <div class="element-legende">
        <span class="cercle cercle-petit"></span>
        Moins de 500 habitants
    </div>

    <div class="element-legende">
        <span class="cercle cercle-moyen"></span>
        500 à 2 000 habitants
    </div>

    <div class="element-legende">
        <span class="cercle cercle-grand"></span>
        2 000 à 5 000 habitants
    </div>

    <div class="element-legende">
        <span class="cercle cercle-tres-grand"></span>
        Plus de 5 000 habitants
    </div>
</div>
    <script type="module">

        import * as maplibregl from
            "https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs";

        // Étape 1 : initialisation de la carte sur le Plan IGN
        const protocole = new pmtiles.Protocol();

        maplibregl.addProtocol("pmtiles", protocole.tile);

        const map = new maplibregl.Map({
            container: "map",
            style: "https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/standard.json",
            attributionControl: {
                customAttribution: "Plan IGN © IGN | Communes : IGN | Population : INSEE | Périmètres du Parc : DREAL Nouvelle-Aquitaine / SIGENA"
            }
        });

        // Cadrage sur le Parc national des Pyrénées
        map.fitBounds(
            [[-0.697, 42.673], [0.367, 43.178]],
            { animate: false }
        );

        // Contrôles de navigation
        map.addControl(
            new maplibregl.NavigationControl(),
            "top-left"
        );

        // Échelle cartographique
        map.addControl(
            new maplibregl.ScaleControl(),
            "bottom-left"
        );

        // Rendre la carte accessible pour les étapes suivantes
        window.map = map;

        map.on("load", () => {
            map.addSource("parc", {
        type: "vector",
        url: "pmtiles://donnees/Couches_TP.pmtiles"
        });
        console.log("Source PMTiles ajoutée :", map.getSource("parc"));
        map.addLayer({
    id: "communes",
    type: "fill",
    source: "parc",
    "source-layer": "communes",
    paint: {
        "fill-color": [
    "case",
    ["==", ["get", "dans_coeur"], true],
    "#e76f51",
    "#9acb9a"
],
        "fill-opacity": 0.5,
        "fill-outline-color": "#555555"
    }
});
map.addLayer({
    id: "aire",
    type: "line",
    source: "parc",
    "source-layer": "aire",
    paint: {
        "line-color": "#e68a24",
        "line-width": 2,
        "line-dasharray": [3, 2]
    }
});
map.addLayer({
    id: "coeur",
    type: "fill",
    source: "parc",
    "source-layer": "coeur",
    paint: {
        "fill-color": "#41ab5d",
        "fill-opacity": 0.3,
        "fill-outline-color": "#176b3a"
    }
});
map.addLayer({
    id: "communes_points",
    type: "circle",
    source: "parc",
    "source-layer": "communes_points",
    paint: {
        "circle-radius": [
    "step",
    ["to-number", ["get", "population"], 0],
    3,
    500, 5,
    2000, 8,
    5000, 12
],
        "circle-color": "#2864a5",
        "circle-opacity": 0.8,
        "circle-stroke-color": "#ffffff",
        "circle-stroke-width": 1
    }
});
document.querySelectorAll(".element-legende[data-layer]").forEach((element) => {

    element.addEventListener("click", () => {

        // Récupérer le nom de la couche
        const layer = element.dataset.layer;

        // Lire sa visibilité actuelle
        const visibility = map.getLayoutProperty(layer, "visibility");

        // Inverser sa visibilité
        if (visibility === "none") {
            map.setLayoutProperty(layer, "visibility", "visible");
            element.classList.remove("inactive");
        } else {
            map.setLayoutProperty(layer, "visibility", "none");
            element.classList.add("inactive");
        }
    });
});
map.on("click", "communes", (e) => {

    const commune = e.features[0].properties;

    // Calcul de la proportion de la commune dans l'aire d'adhésion
    const proportionAire = commune.surface_totale_km2 > 0
        ? (commune.surface_aire_km2 / commune.surface_totale_km2) * 100
        : 0;

    // Contenu de la fenêtre
    const contenu = `
        <strong>${commune.nom}</strong>
        <hr>
        Population : ${Number(commune.population).toLocaleString("fr-FR")} habitants
        <br>
        Part dans le cœur : ${Number(commune.part_coeur_pct).toFixed(1)} %
        <br>
        Part dans l'aire d'adhésion : ${proportionAire.toFixed(1)} %
    `;

    new maplibregl.Popup()
        .setLngLat(e.lngLat)
        .setHTML(contenu)
        .addTo(map);
});

    });

    </script>

</body>
</html>
